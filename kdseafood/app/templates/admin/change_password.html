{% extends "admin/base.html" %}
{% from "partials/macros.html" import csrf with context %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block heading %}Đổi mật khẩu quản trị{% endblock %}
{% block content %}
<div class="card-a p-4" style="max-width: 480px">
  <form method="post">
    {{ csrf() }}
    <div class="mb-3"><label class="form-label">Mật khẩu hiện tại</label><input class="form-control" type="password" name="old_password" required></div>
    <div class="mb-3"><label class="form-label">Mật khẩu mới</label><input class="form-control" type="password" name="new_password" minlength="6" required></div>
    <div class="mb-3"><label class="form-label">Nhập lại mật khẩu mới</label><input class="form-control" type="password" name="confirm_password" minlength="6" required></div>
    <button class="btn btn-coral">Đổi mật khẩu</button>
  </form>
</div>
{% endblock %}
